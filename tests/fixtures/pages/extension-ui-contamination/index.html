<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Extension UI contamination fixture</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: system-ui, sans-serif;
      }

      main {
        box-sizing: border-box;
        inline-size: 100%;
        min-block-size: 100vh;
        padding: 24px;
      }

      #breakpoint-state::after {
        content: "wide";
      }

      @media (width < 700px) {
        #breakpoint-state::after {
          content: "narrow";
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Measurement surface fixture</h1>
      <p id="breakpoint-state" aria-label="Breakpoint state"></p>
      <button id="target-page-action" type="button">Target Page action</button>
    </main>
    <script>
      window.fixtureResizeCount = 0;
      window.fixtureCapturedUiEvents = [];
      window.fixtureObservedUiEvents = [];
      window.fixtureTargetPageActionCount = 0;
      window.addEventListener("resize", () => {
        window.fixtureResizeCount += 1;
      });
      for (const eventType of ["click", "pointerdown", "keydown"]) {
        document.addEventListener(
          eventType,
          () => {
            window.fixtureCapturedUiEvents.push(eventType);
          },
          { capture: true },
        );
        document.addEventListener(eventType, () => {
          window.fixtureObservedUiEvents.push(eventType);
        });
      }
      document
        .querySelector("#target-page-action")
        .addEventListener("click", () => {
          window.fixtureTargetPageActionCount += 1;
        });
    </script>
  </body>
</html>
