<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Synthetic workspace · UI Torture Lab</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f6f5ef; color: #20251f; font: 16px/1.5 Arial, sans-serif; }
      main { width: min(760px, calc(100vw - 440px)); margin: 52px 48px; }
      header { border-bottom: 1px solid #bfc3b8; padding-bottom: 20px; margin-bottom: 36px; font-weight: 700; }
      h1 { margin: 0 0 12px; font-size: 30px; line-height: 1.2; }
      .intro { color: #545d4f; margin-bottom: 36px; }
      section { border-block: 1px solid #bfc3b8; padding: 24px 0; }
      h2 { margin: 0 0 24px; font-size: 13px; text-transform: uppercase; letter-spacing: .12em; font-weight: 400; }
      #plan-name { margin: 0 0 12px; width: 230px; overflow: hidden; white-space: nowrap; font-size: 22px; font-weight: 700; }
      .detail { margin: 0; color: #545d4f; }
      footer { margin-top: 32px; color: #545d4f; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <header>Northstar workspace</header>
      <h1>Plan summary</h1>
      <p class="intro">Review your workspace plan.</p>
      <section aria-label="Workspace plan">
        <h2>Selected plan</h2>
        <p id="plan-name">Team workspace</p>
        <p class="detail">Monthly billing</p>
      </section>
      <footer>Synthetic interface · no customer data</footer>
    </main>
  </body>
</html>
